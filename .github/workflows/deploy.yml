name: Deploy PLG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-plg
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via SSH (password)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare remote deploy directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          # script_stop breaks multiline scripts (injects $? checks between every line)
          script: |
            mkdir -p "$DEPLOY_PATH"

      - name: Upload stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml,loki/,promtail/,grafana/,scripts/,.env.example"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,GRAFANA_ADMIN_PASSWORD,GRAFANA_ADMIN_USER,GRAFANA_ROOT_URL
          command_timeout: 15m
          script: |
            chmod +x "$DEPLOY_PATH/scripts/deploy.sh"
            bash "$DEPLOY_PATH/scripts/deploy.sh"
